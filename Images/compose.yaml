
services:
  server1:
    build:
      context: ./server
      dockerfile: Dockerfile.server
    image: sdn-server:1.0
    environment:
      SERVER_ID: server1
      SERVER_PORT: '8080'
      WORKERS: '2'
      WORK_CPU_MS: '20'
    cpus: 2.0
    mem_limit: 1g
    ports:
      - '8081:8080'

  server2:
    build:
      context: ./server
      dockerfile: Dockerfile.server
    image: sdn-server:1.0
    environment:
      SERVER_ID: server2
      SERVER_PORT: '8080'
      WORKERS: '2'
      WORK_CPU_MS: '20'
    cpus: 0.5
    mem_limit: 256m
    ports:
      - '8082:8080'

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.client
    image: sdn-client:1.0
    command: ["sleep", "infinity"]
    depends_on:
      - server1
      - server2
    volumes:
      - ./results:/results
